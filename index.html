                  {/* 4 Detailed Metric Badges */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                    <div className="p-2.5 rounded-xl bg-lime-400/10 border border-lime-400/30">
                      <div className="text-[10px] text-slate-400">ระดับความเข้มข้น</div>
                      <div className="font-black text-lime-400 mt-0.5">{selectedCourse.difficulty.split('(')[0]}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30">
                      <div className="text-[10px] text-slate-400">ระยะเวลาคอร์ส</div>
                      <div className="font-black text-cyan-400 mt-0.5">{selectedCourse.duration.split('(')[0]}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30">
                      <div className="text-[10px] text-slate-400">อัตราเผาผลาญ</div>
                      <div className="font-black text-rose-400 mt-0.5">{selectedCourse.burn.split('/')[0]}</div>
                    </div>
                    <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30">
                      <div className="text-[10px] text-slate-400">เรตติ้งผู้เรียน</div>
                      <div className="font-black text-amber-400 mt-0.5">★ {selectedCourse.rating} ({selectedCourse.reviewsCount})</div>
                    </div>
                  </div>

                  {/* Coach Bio */}
                  <div className="p-3.5 rounded-2xl border border-white/10 bg-slate-900/60 flex items-center gap-3">
                    <span className="w-10 h-10 rounded-2xl bg-lime-400 text-slate-950 font-black flex items-center justify-center text-lg flex-shrink-0">
                      🥋
                    </span>
                    <div>
                      <div className="text-xs font-black">{selectedCourse.instructor}</div>
                      <div className="text-[11px] text-slate-400">{selectedCourse.instructorRole}</div>
                    </div>
                  </div>

                  {/* Course Syllabus */}
                  <div className="space-y-2">
                    <h4 className="text-xs font-black text-slate-300">โครงสร้างบทเรียนในคอร์ส:</h4>
                    <div className="space-y-1.5">
                      {selectedCourse.syllabus.map((s, idx) => (
                        <div key={idx} className="flex items-center gap-2 p-2 rounded-xl bg-white/5 border border-white/5 text-xs text-slate-300">
                          <span className="w-5 h-5 rounded-full bg-lime-400/20 text-lime-400 flex items-center justify-center font-bold text-[10px]">
                            {idx + 1}
                          </span>
                          <span>{s}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* QR Payment Box */}
                  <div className="p-4 rounded-2xl bg-slate-950 border border-lime-400/40 text-center space-y-2">
                    <div className="text-xs font-bold text-lime-400">สแกนชำระเงินผ่าน PromptPay QR Code</div>
                    <div className="w-32 h-32 bg-slate-900 text-lime-400 border border-lime-400 rounded-xl mx-auto flex flex-col items-center justify-center font-mono text-xs">
                      <span className="text-2xl">📱</span>
                      <span className="mt-1 font-black">[ PROMPTPAY ]</span>
                      <span className="text-[10px] text-slate-400">฿{selectedCourse.price.toLocaleString()}</span>
                    </div>
                    <div className="text-[10px] text-slate-400">เข้าถึงคลาสได้ตลอดชีพพร้อมระบบให้คำปรึกษาโค้ชส่วนตัว</div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className={`p-4 border-t flex items-center justify-between ${
                  isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'
                }`}>
                  <div>
                    <span className="text-[10px] text-slate-400">ยอดชำระสุทธิ</span>
                    <div className="text-xl font-black text-lime-400">฿{selectedCourse.price.toLocaleString()}</div>
                  </div>
                  <button 
                    onClick={() => {
                      alert(`สมัครคอร์ส "${selectedCourse.title}" สำเร็จ! เริ่มต้นบทเรียนแรกได้ทันที`);
                      setSelectedCourse(null);
                    }}
                    className="px-6 py-2.5 bg-lime-400 text-slate-950 font-black rounded-xl text-xs hover:bg-lime-500 shadow-lg shadow-lime-400/25"
                  >
                    ยืนยันการชำระเงินและเริ่มเรียน
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==============================================================
    // 4. NUTRITION MODULE (Food Scanner & Top-Center Analysis Modal)
    // ==============================================================
    function NutritionModule({ isDark, scheduleItems, setScheduleItems, dailyCalorieBudget }) {
      const [analyzedFood, setAnalyzedFood] = useState(null);
      const [showScannerModal, setShowScannerModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [scanningStep, setScanningStep] = useState('camera'); // 'camera', 'analyzing', 'result'
      const [scannedImage, setScannedImage] = useState(null);
      const [recognizedDish, setRecognizedDish] = useState(null);

      // Predefined sample dishes for rapid AI food camera scanning demonstration
      const SAMPLE_FOOD_RECOGNITION = [
        {
          name: 'ข้าวกะเพราอกไก่ไข่ดาวไม่น้ำมัน',
          category: 'อาหารคลีนโปรตีนสูง',
          calories: 450,
          protein: 38,
          carbs: 48,
          fat: 10,
          glycemicIndex: 'ปานกลาง (Medium)',
          confidence: '98.5%',
          alignment: 'อุดมด้วยโปรตีนลีนจากอกไก่ เหมาะสำหรับมื้อหลักหลังออกกำลังกาย',
          image: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=600&q=80'
        },
        {
          name: 'สลัดกรีกอกไก่ อะโวคาโดและชีสเฟต้า',
          category: 'สลัดสุขภาพ/ไขมันดี',
          calories: 390,
          protein: 32,
          carbs: 18,
          fat: 22,
          glycemicIndex: 'ต่ำ (Low GI)',
          confidence: '96.2%',
          alignment: 'กรดไขมันไม่อิ่มตัวเชิงเดี่ยวสูง เสริมสุขภาพหัวใจและหลอดเลือด',
          image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=600&q=80'
        },
        {
          name: 'ข้าวโพดหวานอบพร้อมสเต็กปลาแซลมอน',
          category: 'ไฮโปรตีน & โอเมก้า 3',
          calories: 520,
          protein: 42,
          carbs: 36,
          fat: 20,
          glycemicIndex: 'ต่ำ (Low GI)',
          confidence: '97.8%',
          alignment: 'มี Astaxanthin และโอเมก้า 3 ช่วยลดการอักเสบของกล้ามเนื้อ',
          image: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=600&q=80'
        }
      ];

      // SYNCHRONIZED CALORIE CALCULATIONS (Derived directly from today's shared scheduleItems)
      const todayDateKey = '2026-11-07';
      const todaySchedule = scheduleItems.filter(item => item.dateKey === todayDateKey);

      const caloriesConsumed = todaySchedule
        .filter(item => item.type === 'food' && item.done)
        .reduce((sum, item) => sum + (item.cal || 0), 0);

      const workoutBurn = todaySchedule
        .filter(item => item.type === 'sport' && item.done)
        .reduce((sum, item) => sum + (item.calBurn || 0), 0);

      const baseBurn = 1420;
      const totalActiveBurned = baseBurn + workoutBurn;
      const netCalorieBalance = caloriesConsumed - totalActiveBurned;
      const caloriesRemainingInBudget = dailyCalorieBudget - caloriesConsumed;

      // Filter all consumed foods for eating history
      const eatingHistory = scheduleItems.filter(item => item.type === 'food' && item.done);

      // Handle custom or sample image upload for AI scanner
      const handleTriggerScan = (presetIndex = 0) => {
        const dish = SAMPLE_FOOD_RECOGNITION[presetIndex];
        setScannedImage(dish.image);
        setScanningStep('analyzing');
        setShowScannerModal(true);
        window.scrollTo({ top: 0, behavior: 'instant' });

        // Simulate AI neural network analysis latency
        setTimeout(() => {
          setRecognizedDish(dish);
          setScanningStep('result');
        }, 1200);
      };

      const handleImageFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            setScannedImage(uploadEvent.target.result);
            setScanningStep('analyzing');
            setShowScannerModal(true);
            window.scrollTo({ top: 0, behavior: 'instant' });

            setTimeout(() => {
              // Intelligently assign an accurate dish estimation
              setRecognizedDish({
                name: 'มื้ออาหารสุขภาพ (ตรวจจับจากรูปถ่าย)',
                category: 'ตรวจจับด้วย AI Vision',
                calories: 420,
                protein: 34,
                carbs: 45,
                fat: 12,
                glycemicIndex: 'ต่ำ-ปานกลาง',
                confidence: '95.4%',
                alignment: 'สัดส่วนมาโครนิวเทรียนท์สมดุล เหมาะสมกับเป้าหมายแคลอรี่ประจำวัน',
                image: uploadEvent.target.result
              });
              setScanningStep('result');
            }, 1400);
          };
          reader.readAsDataURL(file);
        }
      };

      // Save scanned meal into synchronized state
      const handleConfirmSaveMeal = (dish) => {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} น.`;
        
        const newRecord = {
          id: 'food_' + Date.now(),
          dateKey: todayDateKey,
          type: 'food',
          time: timeStr,
          title: dish.name,
          cal: dish.calories,
          protein: dish.protein,
          carbs: dish.carbs,
          fat: dish.fat,
          done: true,
          tag: 'AI Food Scan',
          image: dish.image
        };

        setScheduleItems(prev => [newRecord, ...prev]);
        setShowScannerModal(false);
        setScanningStep('camera');
        setRecognizedDish(null);
      };

      const handleAnalyze = (food) => {
        setAnalyzedFood(food);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      return (
        <div className="space-y-5">

          {/* ========================================================================= */}
          {/* 1. TOP INTERACTIVE AI FOOD SCAN & LOG BANNER                             */}
          {/* ========================================================================= */}
          <section className={`relative rounded-3xl p-4 sm:p-5 border overflow-hidden transition-all shadow-xl ${
            isDark 
              ? 'glass-card-dark bg-gradient-to-br from-indigo-950/80 via-slate-900/90 to-purple-950/70 border-lime-400/30' 
              : 'glass-card-light bg-gradient-to-br from-indigo-50 via-white to-lime-50/60 border-lime-500/40'
          }`}>
            <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-start sm:items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-lime-400 to-emerald-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-lg shadow-lime-400/25 flex-shrink-0 animate-pulse">
                  <Icon name="camera" className="w-6 h-6 stroke-[2.5]" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className={`text-base sm:text-lg font-black tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      AI Food Scanner: ถ่ายรูปอาหารคำนวณแคลอรี่ทันที
                    </h3>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-lime-400 text-slate-950">
                      NEW
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 mt-0.5">
                    สแกนจานอาหาร ประเมินแคลอรี่และสารอาหารอัตโนมัติ พร้อมซิงค์เข้าบันทึกประจำวันทันที
                  </p>
                </div>
              </div>

              {/* Action Buttons: Camera Scan & History Viewer */}
              <div className="flex items-center gap-2.5 flex-wrap sm:flex-nowrap">
                {/* Hidden File Input for Real Photo Upload / Camera Capture */}
                <input
                  type="file"
                  id="food-photo-upload"
                  accept="image/*"
                  capture="environment"
                  className="hidden"
                  onChange={handleImageFileUpload}
                />
                
                <label
                  htmlFor="food-photo-upload"
                  className="cursor-pointer px-4 py-2.5 rounded-xl bg-lime-400 text-slate-950 font-black text-xs hover:bg-lime-500 transition-all flex items-center gap-2 shadow-lg shadow-lime-400/20 active:scale-95"
                >
                  <Icon name="camera" className="w-4 h-4 stroke-[2.5]" />
                  <span>ถ่ายรูป / อัปโหลดจานอาหาร</span>
                </label>

                {/* Instant Sample Scan Button for Quick Demo */}
                <button
                  onClick={() => handleTriggerScan(0)}
                  className={`px-3 py-2.5 rounded-xl text-xs font-bold transition-all border flex items-center gap-1.5 ${
                    isDark ? 'bg-slate-800/80 hover:bg-slate-700 text-slate-200 border-slate-700' : 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300'
                  }`}
                  title="ทดสอบตัวอย่างการสแกน"
                >
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-lime-400" />
                  <span>สแกนตัวอย่าง</span>
                </button>

                {/* History Trigger Button */}
                <button
                  onClick={() => {
                    setShowHistoryModal(true);
                    window.scrollTo({ top: 0, behavior: 'instant' });
                  }}
                  className={`px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all border flex items-center gap-1.5 ${
                    isDark ? 'bg-white/10 hover:bg-white/20 text-white border-white/15' : 'bg-slate-900 text-white hover:bg-slate-800 border-slate-900'
                  }`}
                >
                  <Icon name="history" className="w-4 h-4" />
                  <span>ประวัติทานอาหาร ({eatingHistory.length})</span>
                </button>
              </div>
            </div>
          </section>

          {/* ========================================================================= */}
          {/* 2. SYNCHRONIZED DAILY CALORIE BALANCE TRACKER (EXACT SAME STATE AS MAIN)  */}
          {/* ========================================================================= */}
          <section className={`rounded-3xl p-4 sm:p-5 border transition-all ${
            isDark ? 'glass-card-dark bg-gradient-to-br from-[#1E1B4B]/70 via-[#13172E]/80 to-[#0F172A]/70' : 'glass-card-light'
          }`}>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-white/10">
              <div className="flex items-center gap-2.5">
                <span className="w-9 h-9 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-black text-lg">
                  ⚖️
                </span>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className={`text-sm sm:text-base font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      สมดุลแคลอรี่ประจำวัน (Daily Calorie Balance)
                    </h3>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-lime-400/20 text-lime-400 border border-lime-400/30">
                      ซิงค์แบบเรียลไทม์กับหน้าหลัก
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">คำนวณจากอาหารที่ทานจริง หักลบด้วยพลังงานเผาผลาญและการออกกำลังกาย</p>
                </div>
              </div>

              {/* Status Badge */}
              <div className="flex items-center gap-2">
                <span className={`px-3 py-1 rounded-full text-xs font-black border ${
                  netCalorieBalance <= 0
                    ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400'
                    : 'bg-amber-500/15 border-amber-500/30 text-amber-400'
                }`}>
                  {netCalorieBalance <= 0 
                    ? `🟢 Calorie Deficit (${Math.abs(netCalorieBalance).toLocaleString()} kcal)` 
                    : `🟡 Surplus (+${netCalorieBalance.toLocaleString()} kcal)`}
                </span>
              </div>
            </div>

            {/* 4 Interactive Visual Calorie Columns */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-3 mt-3">
              {/* 1. Target Budget */}
              <div className={`p-3 rounded-2xl border ${isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">เป้าหมาย (Budget)</div>
                <div className={`text-base sm:text-xl font-black mt-0.5 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                  {dailyCalorieBudget.toLocaleString()} <span className="text-xs font-normal text-slate-400">kcal</span>
                </div>
                <div className="text-[10px] text-slate-400 mt-1">เกณฑ์ TDEE แนะนำ</div>
              </div>

              {/* 2. Food Eaten (Live Synchronized) */}
              <div className={`p-3 rounded-2xl border ${isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className="text-[10px] font-bold text-amber-400 uppercase tracking-wider flex items-center justify-between">
                  <span>ทานแล้ว (Intake)</span>
                  <span className="text-[9px] text-slate-400">วันนี้</span>
                </div>
                <div className="text-base sm:text-xl font-black mt-0.5 text-amber-400">
                  {caloriesConsumed.toLocaleString()} <span className="text-xs font-normal text-slate-400">kcal</span>
                </div>
                <div className="text-[10px] text-slate-400 mt-1">
                  เหลือทานได้อีก <strong className="text-lime-400">{Math.max(0, caloriesRemainingInBudget).toLocaleString()}</strong> kcal
                </div>
              </div>

              {/* 3. Total Burned */}
              <div className={`p-3 rounded-2xl border ${isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className="text-[10px] font-bold text-rose-400 uppercase tracking-wider flex items-center justify-between">
                  <span>เผาผลาญ (Burned)</span>
                  <span>🔥</span>
                </div>
                <div className="text-base sm:text-xl font-black mt-0.5 text-rose-400">
                  {totalActiveBurned.toLocaleString()} <span className="text-xs font-normal text-slate-400">kcal</span>
                </div>
                <div className="text-[10px] text-slate-400 mt-1">ก้าวเดิน + เผาผลาญพื้นฐาน</div>
              </div>

              {/* 4. Net Energy Balance */}
              <div className={`p-3 rounded-2xl border ${
                netCalorieBalance <= 0 
                  ? (isDark ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-emerald-50 border-emerald-200')

        setMeds(meds.map(m => {
          if (m.id !== id) return m;
          const nowTaken = !m.taken;
          const rem = nowTaken ? Math.max(0, m.remaining - m.dailyDose) : Math.min(m.totalDose, m.remaining + m.dailyDose);
          return { ...m, taken: nowTaken, remaining: rem };
        }));
      };

      const handleAdd = (e) => {
        e.preventDefault();
        if (!form.name.trim()) return;
        if (form.end < form.start) { alert('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่มทาน'); return; }
        const total = Number(form.totalDose) || 0;
        setMeds([...meds, { id: Date.now(), name: form.name.trim(), time: form.time, dailyDose: Number(form.dailyDose) || 1, totalDose: total, remaining: total, start: form.start, end: form.end, taken: false }]);
        setForm(emptyForm);
        setIsAddOpen(false);
      };

      const placeOrder = (e) => {
        e.preventDefault();
        setOrderNo('AH' + String(Date.now()).slice(-8));
        setStep('done');
      };
      const closeCart = () => {
        if (step === 'done') { setCart({}); setAddr(emptyAddr); setCard({ no: '', exp: '', cvv: '' }); }
        setCartOpen(false); setStep('cart');
      };

      const inputCls = `w-full px-3 py-2 rounded-xl border text-xs outline-none ${isDark ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`;
      const labelCls = 'block text-[11px] font-bold text-slate-400 mb-1';
      const cardCls = isDark ? 'glass-card-dark' : 'glass-card-light';
      const overlayCls = `fixed inset-0 z-50 flex items-start justify-center pt-4 sm:pt-8 px-3 sm:px-4 pb-12 overflow-y-auto backdrop-blur-md animate-fadeIn ${isDark ? 'bg-black/80' : 'bg-slate-900/50'}`;
      const modalCls = `w-full max-w-md rounded-3xl border p-5 sm:p-6 space-y-4 shadow-2xl relative ${isDark ? 'bg-slate-900 border-white/20 text-white' : 'bg-white border-slate-200 text-slate-900'}`;

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center gap-2">
            <div>
              <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
                ตารางเวลาทานยาและเวชภัณฑ์
              </h2>
              <p className="text-xs text-slate-400">ระบบเตือนอัตโนมัติพร้อมตัดสต็อกยาในครัวเรือน</p>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={() => { setCartOpen(true); setStep('cart'); window.scrollTo({ top: 0, behavior: 'instant' }); }}
                className={`relative px-3 py-2 rounded-xl text-sm border ${isDark ? 'bg-white/10 border-white/10' : 'bg-white border-slate-200'}`} aria-label="ตะกร้า">
                🛒
                {cartCount > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-lime-400 text-slate-950 text-[10px] font-black flex items-center justify-center">{cartCount}</span>}
              </button>
              {view === 'schedule' && (
                <button onClick={() => { setIsAddOpen(true); window.scrollTo({ top: 0, behavior: 'instant' }); }}
                  className="px-4 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500 flex items-center gap-1.5">
                  <Icon name="plus" className="w-4 h-4 stroke-[3]" /> เพิ่มยาใหม่
                </button>
              )}
            </div>
          </div>

          {/* Sub tabs */}
          <div className={`flex gap-1 p-1 rounded-2xl w-full sm:w-fit ${isDark ? 'bg-white/5' : 'bg-slate-200/60'}`}>
            {[['schedule', '💊 ตารางทานยา'], ['shop', '🛍️ ร้านค้าอาหารเสริม']].map(([k, l]) => (
              <button key={k} onClick={() => setView(k)}
                className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black transition-all ${view === k ? 'bg-lime-400 text-slate-950' : 'text-slate-400 hover:text-slate-200'}`}>{l}</button>
            ))}
          </div>

          {view === 'schedule' && (
            <div className="space-y-2.5">
              {meds.map(m => {
                const pct = m.totalDose ? Math.round(((m.totalDose - m.remaining) / m.totalDose) * 100) : 0;
                const low = m.remaining <= m.dailyDose * 7;
                return (
                  <div key={m.id} onClick={() => handleToggle(m.id)}
                    className={`p-4 rounded-2xl border cursor-pointer transition-all space-y-3 ${cardCls}`}>
                    <div className="flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3 min-w-0">
                        <span className={`w-8 h-8 shrink-0 rounded-xl flex items-center justify-center text-sm ${m.taken ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                          {m.taken ? '✓' : '💊'}
                        </span>
                        <div className="min-w-0">
                          <h4 className={`text-sm font-bold truncate ${m.taken ? 'line-through text-slate-400' : ''}`}>{m.name}</h4>
                          <span className="text-xs text-slate-400">เวลาทาน: {m.time} น. · วันละ {m.dailyDose} เม็ด</span>
                        </div>
                      </div>
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full shrink-0 ${m.taken ? 'bg-emerald-500/20 text-emerald-400' : isDark ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-600'}`}>
                        {m.taken ? 'ทานแล้ว' : 'ยังไม่ทาน'}
                      </span>
                    </div>
                    <div>
                      <div className="flex justify-between text-[11px] text-slate-400 mb-1">
                        <span>คงเหลือ {m.remaining}/{m.totalDose} เม็ด</span>
                        <span>{fmtDate(m.start)} – {fmtDate(m.end)}</span>
                      </div>
                      <div className={`h-1.5 rounded-full overflow-hidden ${isDark ? 'bg-white/10' : 'bg-slate-200'}`}>
                        <div className="h-full bg-lime-400" style={{ width: pct + '%' }} />
                      </div>
                      {low && (
                        <div className="flex items-center justify-between mt-2">
                          <span className="text-[11px] text-amber-400 font-bold">⚠ ยาใกล้หมด (เหลือไม่ถึง 7 วัน)</span>
                          <button onClick={(e) => { e.stopPropagation(); setView('shop'); }} className="text-[11px] font-black text-lime-400 hover:underline">ซื้อเพิ่ม →</button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {view === 'shop' && (
            <div className="space-y-3">
              <div className={`p-3 rounded-2xl border text-[11px] text-slate-400 ${cardCls}`}>
                ✅ จำหน่ายเฉพาะผลิตภัณฑ์เสริมอาหารที่ถูกต้องตามกฎหมาย · 🚚 จัดส่งถึงบ้าน ค่าส่ง ฿50 (ฟรีเมื่อสั่งครบ ฿999)
              </div>
              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                {cats.map(c => (
                  <button key={c} onClick={() => setCat(c)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border ${cat === c ? 'bg-lime-400 text-slate-950 border-lime-400' : isDark ? 'border-white/15 text-slate-300' : 'border-slate-300 text-slate-600'}`}>{c}</button>
                ))}
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {products.filter(p => cat === 'ทั้งหมด' || p.cat === cat).map(p => (
                  <div key={p.id} className={`p-4 rounded-2xl border flex gap-3 items-center ${cardCls}`}>
                    <div className={`w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-3xl ${isDark ? 'bg-white/5' : 'bg-slate-100'}`}>{p.emoji}</div>
                    <div className="flex-1 min-w-0">
                      <span className="text-[10px] font-black text-lime-400">{p.cat}</span>
                      <h4 className="text-sm font-bold leading-tight">{p.name}</h4>
                      <p className="text-[11px] text-slate-400 leading-snug">{p.desc}</p>
                      <div className="flex items-center justify-between mt-1.5">
                        <span className="text-sm font-black">{baht(p.price)}</span>
                        <button onClick={() => changeQty(p.id, 1)} className="px-3 py-1.5 bg-lime-400 text-slate-950 font-black text-[11px] rounded-lg hover:bg-lime-500">
                          + ใส่ตะกร้า{cart[p.id] ? ` (${cart[p.id]})` : ''}
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              {cartCount > 0 && (
                <button onClick={() => { setCartOpen(true); setStep('cart'); window.scrollTo({ top: 0, behavior: 'instant' }); }}
                  className="w-full py-3 bg-lime-400 text-slate-950 font-black text-sm rounded-2xl hover:bg-lime-500">
                  🛒 ดูตะกร้า ({cartCount} ชิ้น) · {baht(subtotal)}
                </button>
              )}
            </div>
          )}

          {/* Add medication modal */}
          {isAddOpen && (
            <div ref={(el) => { if (el) el.scrollTop = 0; }} className={overlayCls}>
              <div className={modalCls}>
                <h3 className="text-base font-bold">เพิ่มยาใหม่</h3>
                <form onSubmit={handleAdd} className="space-y-3">
                  <div>
                    <label className={labelCls}>ชื่อยาหรือวิตามิน</label>
                    <input type="text" required value={form.name} onChange={(e) => setF('name', e.target.value)} placeholder="เช่น CoQ10 100mg" className={inputCls} />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={labelCls}>เวลาทาน</label>
                      <input type="time" required value={form.time} onChange={(e) => setF('time', e.target.value)} className={inputCls} />
                    </div>
                    <div>
                      <label className={labelCls}>ปริมาณต่อวัน (เม็ด/วัน)</label>
                      <input type="number" min="1" required value={form.dailyDose} onChange={(e) => setF('dailyDose', e.target.value)} className={inputCls} />
                    </div>
                  </div>
                  <div>
                    <label className={labelCls}>ปริมาณทั้งหมด (เม็ด)</label>
                    <input type="number" min="1" required value={form.totalDose} onChange={(e) => setF('totalDose', e.target.value)} className={inputCls} />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={labelCls}>วันที่เริ่มทาน</label>
                      <input type="date" required value={form.start} onChange={(e) => setF('start', e.target.value)} className={inputCls} />
                    </div>
                    <div>
                      <label className={labelCls}>วันที่สิ้นสุด</label>
                      <input type="date" required min={form.start} value={form.end} onChange={(e) => setF('end', e.target.value)} className={inputCls} />
                    </div>
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button type="submit" className="flex-1 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">บันทึก</button>
                    <button type="button" onClick={() => setIsAddOpen(false)} className={`px-4 py-2 text-xs rounded-xl ${isDark ? 'bg-white/10 hover:bg-white/20' : 'bg-slate-100 hover:bg-slate-200'}`}>ยกเลิก</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Cart / checkout modal */}
          {cartOpen && (
            <div ref={(el) => { if (el) el.scrollTop = 0; }} className={overlayCls}>
              <div className={modalCls}>
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold">
                    {step === 'cart' ? '🛒 ตะกร้าสินค้า' : step === 'checkout' ? 'ที่อยู่จัดส่งและชำระเงิน' : '🎉 สั่งซื้อสำเร็จ'}
                  </h3>
                  <button onClick={closeCart} className="text-slate-400 hover:text-white" aria-label="ปิด"><Icon name="x" className="w-5 h-5" /></button>
                </div>

                {step === 'cart' && (cartItems.length === 0 ? (
                  <p className="text-xs text-slate-400 text-center py-6">ยังไม่มีสินค้าในตะกร้า</p>
                ) : (
                  <div className="space-y-3">
                    {cartItems.map(i => (
                      <div key={i.id} className="flex items-center gap-3">
                        <span className="text-2xl">{i.emoji}</span>
                        <div className="flex-1 min-w-0">
                          <p className="text-xs font-bold truncate">{i.name}</p>
                          <p className="text-[11px] text-slate-400">{baht(i.price)}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => changeQty(i.id, -1)} className="w-6 h-6 rounded-lg bg-white/10 text-xs font-black">−</button>
                          <span className="text-xs font-bold w-4 text-center">{i.qty}</span>
                          <button onClick={() => changeQty(i.id, 1)} className="w-6 h-6 rounded-lg bg-white/10 text-xs font-black">+</button>
                        </div>
                      </div>
                    ))}
                    <div className="border-t border-white/10 pt-3 space-y-1 text-xs">
                      <div className="flex justify-between"><span className="text-slate-400">ราคาสินค้า</span><span>{baht(subtotal)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">ค่าจัดส่ง</span><span>{shipping === 0 ? 'ฟรี' : baht(shipping)}</span></div>
                      <div className="flex justify-between text-sm font-black"><span>ยอดรวม</span><span className="text-lime-400">{baht(total)}</span></div>
                    </div>
                    <button onClick={() => setStep('checkout')} className="w-full py-2.5 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">สั่งซื้อสินค้า</button>
                  </div>
                ))}

                {step === 'checkout' && (
                  <form onSubmit={placeOrder} className="space-y-3">
                    <p className="text-xs font-black text-lime-400">1. ที่อยู่จัดส่ง</p>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className={labelCls}>ชื่อ-นามสกุล</label><input required value={addr.name} onChange={e => setAddr({ ...addr, name: e.target.value })} className={inputCls} /></div>
                      <div><label className={labelCls}>เบอร์โทรศัพท์</label><input required type="tel" pattern="[0-9]{9,10}" title="กรอกเบอร์โทร 9-10 หลัก" value={addr.phone} onChange={e => setAddr({ ...addr, phone: e.target.value })} className={inputCls} /></div>
                    </div>
                    <div><label className={labelCls}>ที่อยู่ (บ้านเลขที่ ซอย ถนน)</label><input required value={addr.address} onChange={e => setAddr({ ...addr, address: e.target.value })} className={inputCls} /></div>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className={labelCls}>แขวง/ตำบล</label><input required value={addr.subdistrict} onChange={e => setAddr({ ...addr, subdistrict: e.target.value })} className={inputCls} /></div>
                      <div><label className={labelCls}>เขต/อำเภอ</label><input required value={addr.district} onChange={e => setAddr({ ...addr, district: e.target.value })} className={inputCls} /></div>
                      <div><label className={labelCls}>จังหวัด</label><input required value={addr.province} onChange={e => setAddr({ ...addr, province: e.target.value })} className={inputCls} /></div>
                      <div><label className={labelCls}>รหัสไปรษณีย์</label><input required pattern="[0-9]{5}" title="รหัสไปรษณีย์ 5 หลัก" value={addr.zip} onChange={e => setAddr({ ...addr, zip: e.target.value })} className={inputCls} /></div>
                    </div>
                    <div><label className={labelCls}>หมายเหตุถึงผู้จัดส่ง (ไม่บังคับ)</label><input value={addr.note} onChange={e => setAddr({ ...addr, note: e.target.value })} className={inputCls} /></div>

                    <p className="text-xs font-black text-lime-400 pt-1">2. ช่องทางชำระเงิน</p>
                    <div className="grid grid-cols-3 gap-2">
                      {[['promptpay', 'PromptPay'], ['card', 'บัตรเครดิต'], ['cod', 'เก็บเงินปลายทาง']].map(([k, l]) => (
                        <button type="button" key={k} onClick={() => setPay(k)}
                          className={`py-2 rounded-xl text-[11px] font-bold border ${pay === k ? 'bg-lime-400 text-slate-950 border-lime-400' : isDark ? 'border-white/15 text-slate-300' : 'border-slate-300 text-slate-600'}`}>{l}</button>
                      ))}
                    </div>
                    {pay === 'promptpay' && (
                      <div className={`p-3 rounded-xl text-center text-[11px] text-slate-400 ${isDark ? 'bg-white/5' : 'bg-slate-100'}`}>
                        <div className="text-5xl mb-1">▦</div>สแกน QR PromptPay เพื่อชำระ {baht(total)} หลังกดยืนยันคำสั่งซื้อ
                      </div>
                    )}
                    {pay === 'card' && (
                      <div className="space-y-3">
                        <div><label className={labelCls}>หมายเลขบัตร</label><input required inputMode="numeric" pattern="[0-9 ]{15,19}" placeholder="0000 0000 0000 0000" value={card.no} onChange={e => setCard({ ...card, no: e.target.value })} className={inputCls} /></div>
                        <div className="grid grid-cols-2 gap-3">
                          <div><label className={labelCls}>วันหมดอายุ (MM/YY)</label><input required pattern="[0-9]{2}/[0-9]{2}" placeholder="MM/YY" value={card.exp} onChange={e => setCard({ ...card, exp: e.target.value })} className={inputCls} /></div>
                          <div><label className={labelCls}>CVV</label><input required type="password" inputMode="numeric" pattern="[0-9]{3,4}" value={card.cvv} onChange={e => setCard({ ...card, cvv: e.target.value })} className={inputCls} /></div>
                        </div>
                      </div>
                    )}
                    {pay === 'cod' && <p className="text-[11px] text-slate-400">ชำระเงินสดกับพนักงานจัดส่งเมื่อได้รับสินค้า {baht(total)}</p>}

                    <div className="border-t border-white/10 pt-3 flex justify-between text-sm font-black">
                      <span>ยอดชำระ ({cartCount} ชิ้น)</span><span className="text-lime-400">{baht(total)}</span>
                    </div>
                    <div className="flex gap-2">
                      <button type="submit" className="flex-1 py-2.5 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">
                        {pay === 'cod' ? 'ยืนยันคำสั่งซื้อ' : 'ชำระเงิน ' + baht(total)}
                      </button>
                      <button type="button" onClick={() => setStep('cart')} className={`px-4 py-2 text-xs rounded-xl ${isDark ? 'bg-white/10 hover:bg-white/20' : 'bg-slate-100 hover:bg-slate-200'}`}>กลับ</button>
                    </div>
                  </form>
                )}

                {step === 'done' && (
                  <div className="text-center space-y-3 py-2">
                    <div className="text-5xl">📦</div>
                    <p className="text-sm font-bold">หมายเลขคำสั่งซื้อ {orderNo}</p>
                    <p className="text-xs text-slate-400">
                      เราจะจัดส่งไปที่ {addr.name} · {addr.address} {addr.subdistrict} {addr.district} {addr.province} {addr.zip}<br />
                      ชำระด้วย {pay === 'promptpay' ? 'PromptPay' : pay === 'card' ? 'บัตรเครดิต' : 'เก็บเงินปลายทาง'} · {baht(total)}
                    </p>
                    <button onClick={closeCart} className="w-full py-2.5 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">เสร็จสิ้น</button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==============================================================
    // 6. TELEMEDICINE MODULE
    // ==============================================================
    // ---- AI Health Screening (rule-based triage chat) ----
    const TRIAGE_RULES = [
      { level: 3, key: ['เจ็บหน้าอก', 'แน่นหน้าอก', 'หายใจไม่ออก', 'หายใจลำบาก', 'หมดสติ', 'ชัก', 'หน้าเบี้ยว', 'พูดไม่ชัด', 'แขนขาอ่อนแรง', 'อาเจียนเป็นเลือด', 'ถ่ายเป็นเลือด', 'เลือดออกไม่หยุด', 'แพ้อย่างรุนแรง', 'ปากบวม', 'ทำร้ายตัวเอง', 'อยากตาย'],
        title: 'อาการที่อาจเป็นภาวะฉุกเฉิน',
        tips: ['โทร 1669 (สายด่วนการแพทย์ฉุกเฉิน) หรือไปห้องฉุกเฉินที่ใกล้ที่สุดทันที', 'อย่าขับรถไปเองหากรู้สึกวิงเวียนหรือใกล้หมดสติ', 'ให้ผู้อื่นอยู่เป็นเพื่อน และเตรียมรายชื่อยาที่ใช้อยู่', 'หากมีความคิดทำร้ายตัวเอง โทรสายด่วนสุขภาพจิต 1323 ได้ตลอด 24 ชั่วโมง'] },
      { level: 2, key: ['ไข้สูง', 'ไข้ไม่ลด', 'ปวดท้องรุนแรง', 'ปวดหัวรุนแรง', 'ปัสสาวะเป็นเลือด', 'ขาบวมข้างเดียว', 'ใจสั่นมาก', 'ตาพร่า', 'ซึม', 'ขาดน้ำ', 'ถ่ายเหลวหลายครั้ง'],
        title: 'ควรพบแพทย์โดยเร็ว (ภายใน 24 ชม.)',
        tips: ['ปรึกษาแพทย์ออนไลน์ หรือไปโรงพยาบาลวันนี้', 'จดเวลาที่เริ่มมีอาการ ความรุนแรง และยาที่ทานไปแล้ว', 'จิบน้ำหรือเกลือแร่บ่อย ๆ และพักผ่อน', 'หากอาการแย่ลงอย่างรวดเร็ว ให้ไปห้องฉุกเฉิน'] },
      { level: 1, key: ['ไข้', 'ตัวร้อน', 'หนาวสั่น'], title: 'มีไข้',
        tips: ['วัดอุณหภูมิทุก 4–6 ชม. เช็ดตัวและดื่มน้ำมาก ๆ', 'พักผ่อนให้เพียงพอ ทานพาราเซตามอลตามฉลากได้หากไม่มีข้อห้าม', 'ควรพบแพทย์หากไข้เกิน 38.5°C นานเกิน 2–3 วัน หรือมีผื่น ปวดศีรษะรุนแรง/คอแข็ง'] },
      { level: 1, key: ['ปวดหัว', 'ปวดศีรษะ', 'ไมเกรน'], title: 'ปวดศีรษะ',
        tips: ['พักในที่เงียบ แสงน้อย ดื่มน้ำให้พอ และลดคาเฟอีน/หน้าจอ', 'นอนหลับให้เพียงพอ และสังเกตตัวกระตุ้น เช่น เครียด อดอาหาร', 'ควรพบแพทย์หากปวดรุนแรงฉับพลัน ปวดหลังศีรษะกระแทก หรือมีชา/พูดไม่ชัดร่วมด้วย'] },
      { level: 1, key: ['ไอ', 'เจ็บคอ', 'น้ำมูก', 'คัดจมูก', 'จาม'], title: 'อาการทางเดินหายใจส่วนบน',
        tips: ['จิบน้ำอุ่น อมยาอมหรือกลั้วคอด้วยน้ำเกลือ', 'สวมหน้ากากเมื่ออยู่ใกล้ผู้อื่น และงดออกกำลังกายหนักชั่วคราว', 'ควรพบแพทย์หากไอเกิน 2 สัปดาห์ ไอเป็นเลือด หรือเหนื่อยหอบ'] },
      { level: 1, key: ['ท้องเสีย', 'ถ่ายเหลว', 'ท้องร่วง'], title: 'ท้องเสีย',
        tips: ['ดื่มเกลือแร่ (ORS) ทีละน้อยแต่บ่อย ๆ', 'ทานอาหารอ่อน เช่น ข้าวต้ม หลีกเลี่ยงของมัน นม และแอลกอฮอล์', 'ควรพบแพทย์หากถ่ายมีเลือด ไข้สูง ปัสสาวะน้อย หรือไม่ดีขึ้นใน 2 วัน'] },
      { level: 1, key: ['ปวดท้อง', 'จุกท้อง', 'ท้องอืด', 'คลื่นไส้', 'อาเจียน', 'แสบท้อง', 'กรดไหลย้อน'], title: 'อาการทางเดินอาหาร',
        tips: ['แบ่งทานมื้อเล็ก ๆ งดอาหารรสจัด/มัน กาแฟ และแอลกอฮอล์', 'ไม่นอนหลังทานอาหารทันที ยกหัวเตียงสูงเล็กน้อยหากมีกรดไหลย้อน', 'ควรพบแพทย์หากปวดเฉพาะจุดมากขึ้น อาเจียนซ้ำ หรืออุจจาระดำ'] },
      { level: 1, key: ['เวียนหัว', 'หน้ามืด', 'มึนหัว', 'บ้านหมุน'], title: 'เวียนศีรษะ/หน้ามืด',
        tips: ['นั่งหรือนอนพักทันที ลุกช้า ๆ และดื่มน้ำให้เพียงพอ', 'ตรวจสอบว่าอดอาหารหรือพักผ่อนไม่พอหรือไม่', 'ควรพบแพทย์หากเป็นซ้ำบ่อย หมดสติ หรือมีเสียงในหูหรือการได้ยินลดลง'] },
      { level: 1, key: ['ปวดกล้ามเนื้อ', 'ปวดเข่า', 'ปวดหลัง', 'ปวดไหล่', 'ข้อเท้าแพลง', 'เคล็ด', 'ปวดข้อ', 'บาดเจ็บ', 'ตะคริว'], title: 'ปวดกล้ามเนื้อ/ข้อ (การออกกำลังกาย)',
        tips: ['หลัก PRICE: พัก ประคบเย็น 15–20 นาที พันรัด และยกสูง ในช่วง 48 ชม. แรก', 'งดกิจกรรมที่ทำให้ปวดเพิ่ม แล้วค่อย ๆ กลับมายืดเหยียดเบา ๆ', 'ควรพบแพทย์หากบวมมาก ลงน้ำหนักไม่ได้ ชา หรือไม่ดีขึ้นใน 1 สัปดาห์'] },
      { level: 1, key: ['นอนไม่หลับ', 'หลับยาก', 'เครียด', 'วิตกกังวล', 'ใจหวิว'], title: 'นอนไม่หลับ/เครียด',
        tips: ['เข้านอนและตื่นเวลาเดิม งดคาเฟอีนหลังบ่าย และลดหน้าจอก่อนนอน 1 ชม.', 'ฝึกหายใจลึก ๆ (หายใจเข้า 4 วินาที ออก 6 วินาที) หรือเดินเบา ๆ', 'หากเป็นต่อเนื่องเกิน 2 สัปดาห์ ควรปรึกษาแพทย์หรือนักจิตวิทยา'] },
      { level: 1, key: ['ผื่น', 'คัน', 'ลมพิษ', 'แพ้'], title: 'ผื่น/อาการแพ้ผิวหนัง',
        tips: ['หลีกเลี่ยงการเกา ล้างผิวด้วยน้ำสะอาดและทามอยส์เจอไรเซอร์', 'สังเกตสิ่งกระตุ้น เช่น อาหาร ยา สบู่ ผงซักฟอก', 'ควรพบแพทย์หากผื่นลามเร็ว มีไข้ หรือบวมที่หน้า/ปาก'] },
      { level: 1, key: ['เหนื่อย', 'อ่อนเพลีย', 'ไม่มีแรง', 'ใจสั่น'], title: 'อ่อนเพลีย/ใจสั่น',
        tips: ['พักผ่อน ดื่มน้ำ และทานอาหารให้ครบมื้อ ลดคาเฟอีนและพลังงานสูง', 'หยุดออกกำลังกายหนักจนกว่าอาการจะดีขึ้น', 'ควรตรวจสุขภาพหากเป็นนานเกิน 1–2 สัปดาห์ หรือใจสั่นร่วมกับเหนื่อยหอบ'] }
    ];
    const LEVEL_META = {
      3: { label: '🚨 ฉุกเฉิน', cls: 'bg-red-500/20 text-red-400 border-red-500/40' },
      2: { label: '⚠️ ควรพบแพทย์เร็ว', cls: 'bg-amber-500/20 text-amber-400 border-amber-500/40' },
      1: { label: '🏠 ดูแลตัวเองเบื้องต้น', cls: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' }
    };
    const triage = (text) => {
      const t = text.replace(/\s+/g, '');
      const hits = TRIAGE_RULES.filter(r => r.key.some(k => t.includes(k)));
      if (!hits.length) return null;
      hits.sort((a, b) => b.level - a.level);
      const top = hits.slice(0, 2);
      const level = top[0].level;
      return { level, items: top };
    };

    function AIScreeningChat({ isDark, onSeeDoctor }) {
      const [msgs, setMsgs] = useState([
        { role: 'ai', text: 'สวัสดีครับ ผมคือ AI คัดกรองสุขภาพของ Aura 🩺 เล่าอาการผิดปกติที่คุณรู้สึกได้เลย เช่น เริ่มเป็นเมื่อไร ปวดตรงไหน ระดับความรุนแรง แล้วผมจะแนะนำวิธีดูแลเบื้องต้นให้ครับ' }
      ]);
      const [input, setInput] = useState('');
      const [typing, setTyping] = useState(false);
      const boxRef = React.useRef(null);
      useEffect(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [msgs, typing]);

      const send = (raw) => {
        const text = (raw ?? input).trim();
        if (!text || typing) return;
        setInput('');
        setMsgs(m => [...m, { role: 'user', text }]);
        setTyping(true);
        setTimeout(() => {
          const r = triage(text);
          const reply = r
            ? { role: 'ai', result: r }
            : { role: 'ai', text: 'ขอข้อมูลเพิ่มเติมหน่อยครับ: อาการเกิดขึ้นที่ส่วนไหนของร่างกาย เริ่มเป็นมานานเท่าไร รุนแรงระดับ 1–10 และมีไข้ ไอ ปวด หรือคลื่นไส้ร่วมด้วยไหม? หากรู้สึกว่าอาการรุนแรงหรือกังวล ควรปรึกษาแพทย์โดยตรง' };
          setMsgs(m => [...m, reply]);
          setTyping(false);
        }, 700);
      };

      const chips = ['มีไข้และเจ็บคอ 2 วัน', 'ปวดเข่าหลังวิ่ง', 'ปวดหัวและนอนไม่หลับ', 'ท้องเสียตั้งแต่เมื่อคืน'];
      const bubbleAi = isDark ? 'bg-white/10 text-slate-100' : 'bg-slate-100 text-slate-800';

      return (
        <div className={`rounded-3xl border overflow-hidden ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
          <div ref={boxRef} className="h-[420px] overflow-y-auto p-4 space-y-3">
            {msgs.map((m, i) => (
              <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[88%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed ${m.role === 'user' ? 'bg-lime-400 text-slate-950 font-semibold' : bubbleAi}`}>
                  {m.text && <p>{m.text}</p>}
                  {m.result && (
                    <div className="space-y-2.5">
                      <span className={`inline-block px-2.5 py-1 rounded-full border text-[11px] font-black ${LEVEL_META[m.result.level].cls}`}>{LEVEL_META[m.result.level].label}</span>
                      {m.result.items.map((it, k) => (
                        <div key={k}>
                          <p className="font-bold mb-1">{it.title}</p>
                          <ul className="list-disc pl-4 space-y-1">{it.tips.map((t, j) => <li key={j}>{t}</li>)}</ul>
                        </div>
                      ))}
                      {m.result.level >= 2 && (
                        <button onClick={onSeeDoctor} className="px-3 py-1.5 bg-lime-400 text-slate-950 font-black text-[11px] rounded-lg hover:bg-lime-500">ปรึกษาแพทย์ออนไลน์ →</button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {typing && <div className="flex"><div className={`rounded-2xl px-3.5 py-2.5 text-xs ${bubbleAi}`}>กำลังวิเคราะห์อาการ...</div></div>}
          </div>
          <div className={`p-3 border-t space-y-2 ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
            <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
              {chips.map(c => (
                <button key={c} onClick={() => send(c)} className={`px-3 py-1 rounded-full text-[11px] whitespace-nowrap border ${isDark ? 'border-white/15 text-slate-300' : 'border-slate-300 text-slate-600'}`}>{c}</button>
              ))}
            </div>
            <form onSubmit={(e) => { e.preventDefault(); send(); }} className="flex gap-2">
              <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="พิมพ์อาการของคุณ..."
                className={`flex-1 px-3 py-2 rounded-xl border text-xs outline-none ${isDark ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
              <button type="submit" className="px-4 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">ส่ง</button>
            </form>
            <p className="text-[10px] text-slate-400">AI คัดกรองให้ข้อมูลเบื้องต้นเท่านั้น ไม่ใช่การวินิจฉัยหรือแทนคำแนะนำของแพทย์ หากมีอาการรุนแรงโทร 1669</p>
          </div>
        </div>
      );
    }

    function TelemedModule({ isDark }) {
      const [view, setView] = useState('doctors'); // doctors | ai
      return (
        <div className="space-y-4">
          <div>
            <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
              ปรึกษาแพทย์และนักกายภาพออนไลน์ (Telemedicine)
            </h2>
            <p className="text-xs text-slate-400">วิดีโอคอลความคมชัดสูงพร้อมรับใบสั่งยาจัดส่งถึงบ้าน</p>
          </div>

          <div className={`flex gap-1 p-1 rounded-2xl w-full sm:w-fit ${isDark ? 'bg-white/5' : 'bg-slate-200/60'}`}>
            {[['doctors', '👨‍⚕️ ปรึกษาแพทย์'], ['ai', '🤖 AI คัดกรองสุขภาพ']].map(([k, l]) => (
              <button key={k} onClick={() => setView(k)}
                className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black transition-all ${view === k ? 'bg-lime-400 text-slate-950' : 'text-slate-400 hover:text-slate-200'}`}>{l}</button>
            ))}
          </div>

          {view === 'ai' && <AIScreeningChat isDark={isDark} onSeeDoctor={() => { setView('doctors'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} />}

          {view === 'doctors' && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {[
              { name: 'พญ. พรประภา (อายุรแพทย์โรคหัวใจ)', hosp: 'รพ. กรุงเทพ', status: 'พร้อมให้คำปรึกษา', img: 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=400&q=80' },
              { name: 'นพ. วรเมธ (เวชศาสตร์ฟื้นฟูการกีฬา)', hosp: 'รพ. สมิติเวช', status: 'คิวถัดไป 14:00 น.', img: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=400&q=80' }
            ].map((doc, idx) => (
              <div key={idx} className={`p-4 rounded-3xl border flex gap-3.5 items-center ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
                <img src={doc.img} alt={doc.name} className="w-16 h-16 rounded-2xl object-cover" />
                <div className="flex-1 min-w-0">
                  <h4 className="font-bold text-sm truncate">{doc.name}</h4>
                  <p className="text-xs text-slate-400">{doc.hosp}</p>
                  <span className="inline-block mt-1 text-[10px] font-black px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">
                    {doc.status}
                  </span>
                </div>
                <button 
                  onClick={() => alert(`เชื่อมต่อระบบวิดีโอคอลกับ ${doc.name}...`)}
                  className="px-3 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500"
                >
                  เริ่มปรึกษา
                </button>
              </div>
            ))}
          </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
