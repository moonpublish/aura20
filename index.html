    html, body {

    /* Splash Screen Animations */
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
    .splash-logo-pulse {
      animation: splashPulse 0.5s ease-in-out infinite;
    }
    .splash-exit-fade {
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
    }

    /* Soft Pastel Light Mode Background */
    body.light-mode-theme {
      background: linear-gradient(135deg, #EEF2FF 0%, #FDF2F8 50%, #F0FDFA 100%) !important;
      background-attachment: fixed !important;
      color: #0f172a !important;
    }

    /* Floating Translucent Header */
    .floating-rounded-header {
      background: rgba(19, 23, 46, 0.58);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 32px -6px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);

      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(203, 213, 225, 0.8);
      box-shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
    }

    /* Inner Glass Capsules */
    .frozen-capsule-bg {
      background: rgba(27, 33, 68, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), 0 4px 12px -2px rgba(0, 0, 0, 0.3);
    }
    .frozen-capsule-bg-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(203, 213, 225, 0.85);
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
    }

    /* Common Card Styling */
    .glass-card-dark {
      background: rgba(30, 27, 75, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 32px -10px rgba(99, 102, 241, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
    }

    /* Raindrop Keyframe Animations for Cloudy/Rain Weather */
    @keyframes rainfall {
      0% {
        transform: translateY(-40px) translateX(0);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(180px) translateX(15px);
        opacity: 0;
      }
    }
    .raindrop-streak {
      position: absolute;
      width: 2px;
      height: 18px;
      background: linear-gradient(to bottom, rgba(56, 189, 248, 0.05), rgba(56, 189, 248, 0.75));
      border-radius: 9999px;
      animation: rainfall linear infinite;
      pointer-events: none;
    }
    .raindrop-streak-light {
      background: linear-gradient(to bottom, rgba(37, 99, 235, 0.05), rgba(37, 99, 235, 0.65));
    }

    /* Fluffy Floating Cloud Animation */
    @keyframes cloudFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    .anim-cloud-float {
      animation: cloudFloat 4.2s ease-in-out infinite;
    }

    /* Fade-in for modal overlays */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.22s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

                { id: 'nutrition', label: 'โภชนาการ', icon: 'utensils' },

    // ==============================================================
    // 1. DASHBOARD MODULE
    // ==============================================================
    function DashboardModule({ userStats, addWater, isDark, setActiveTab, scheduleItems, setScheduleItems, dailyCalorieBudget }) {
      const [selectedDateKey, setSelectedDateKey] = useState('2026-11-07');

      const [scheduleFilter, setScheduleFilter] = useState('all');

      const toggleSchedule = (id) => {
        setScheduleItems(prev => prev.map(item => item.id === id ? { ...item, done: !item.done } : item));
      };

      const dateTabs = [
        { key: '2026-11-07', label: 'วันนี้ (เสาร์ 7 พ.ย.)', short: 'วันนี้' },
        { key: '2026-11-08', label: 'พรุ่งนี้ (อาทิตย์ 8 พ.ย.)', short: 'พรุ่งนี้' },
        { key: '2026-11-09', label: 'จันทร์ 9 พ.ย. 2569', short: '9 พ.ย.' }
      ];

      const activeDateItems = scheduleItems.filter(item => item.dateKey === selectedDateKey);

      const caloriesConsumed = activeDateItems
        .filter(item => item.type === 'food' && item.done)
        .reduce((sum, item) => sum + item.cal, 0);

      const workoutBurnCompleted = activeDateItems
        .filter(item => item.type === 'sport' && item.done)
        .reduce((sum, item) => sum + (item.calBurn || 0), 0);

      const baseBurn = selectedDateKey === '2026-11-07' ? 1420 : 1200;
      const totalActiveBurned = baseBurn + workoutBurnCompleted;
      const netCalorieBalance = caloriesConsumed - totalActiveBurned;
      const caloriesRemainingInBudget = dailyCalorieBudget - caloriesConsumed;

      const filteredTimelineItems = activeDateItems.filter(item => {
        if (scheduleFilter === 'all') return true;
        return item.type === scheduleFilter;
      });

      return (
        <div className="space-y-4 sm:space-y-5 w-full">

          {/* ======================================================== */}
          {/* 1. 3D WEATHER CARD MOVED TO THE VERY TOP OF DASHBOARD     */}

            isDark ? 'glass-card-dark bg-gradient-to-br from-indigo-950/40 via-slate-900/50 to-blue-950/40' : 'glass-card-light bg-gradient-to-br from-blue-50 via-sky-50 to-indigo-50'
          }`}>
            {/* Animated Raindrops Layer */}

                <div

                  className={`raindrop-streak ${!isDark ? 'raindrop-streak-light' : ''}`}
                  style={{
                    left: `${leftPct}%`,
                    animationDelay: `${idx * 0.35}s`,
                    animationDuration: `${1.1 + (idx % 3) * 0.25}s`
                  }}
                />
              ))}
            </div>

            {/* Weather & Metrics Display */}

              {/* Cloudy 3D Illustration & Status */}

                <div className="relative w-12 h-12 flex-shrink-0 anim-cloud-float">
                  <div className="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-amber-400 shadow-[0_0_12px_#fbbf24]"></div>
                  <div className="absolute inset-0 bg-white/95 rounded-2xl shadow-lg border border-sky-100 flex items-center justify-center">
                    <span className="text-xl">☁️</span>
                  </div>
                </div>

                <div>
                  <div className="flex items-center gap-2">

                </div>

                isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'
              }`}>
                <span className="text-xs text-slate-400 flex items-center gap-1.5">🔥 เผาผลาญ:</span>
                <span className="text-xs sm:text-sm font-black text-rose-400">1,420 / 2,100 kcal</span>
              </div>
              <div className={`p-2.5 rounded-2xl border flex items-center justify-between ${
                isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'
              }`}>
                <span className="text-xs text-slate-400 flex items-center gap-1.5">💤 ฟื้นตัว (Recovery):</span>

              </div>
              <div className={`p-2.5 rounded-2xl border flex items-center justify-between ${
                isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'
              }`}>
                <span className="text-xs text-slate-400 flex items-center gap-1.5">⚡ ความพร้อม:</span>

              </div>
            </div>
          </section>

          {/* ========================================================================= */}
          {/* 3. DYNAMIC DAILY CALORIE BALANCE TRACKER                                  */}
          {/* ========================================================================= */}

              <div className="flex items-center gap-2.5">

                    </span>

                  <p className="text-[11px] text-slate-400">คำนวณจากอาหารที่ทานจริง หักลบด้วยพลังงานเผาผลาญและการออกกำลังกาย</p>

              {filteredTimelineItems.map(item => {

                        item.done

                              ? 'bg-slate-900 border-slate-700 text-slate-300 group-hover:border-lime-400' 
                              : 'bg-white border-slate-300 text-slate-600 group-hover:border-indigo-600')

                    >
                      {item.done ? (

                      ) : (
                        <span className="text-xs">{isFood ? '🥗' : isMed ? '💊' : '🏸'}</span>

                    <div
                      onClick={() => toggleSchedule(item.id)}
                      className={`flex-1 p-3 sm:p-3.5 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 cursor-pointer transition-all hover:scale-[1.008] ${
                        item.done
                          ? (isDark ? 'bg-slate-900/40 border-slate-800/80 opacity-75' : 'bg-slate-50 border-slate-200 opacity-80')

                            isDark ? 'bg-slate-800 border-slate-700 text-lime-400' : 'bg-slate-100 border-slate-300 text-slate-800'

                        <div className="text-[11px] text-slate-400 mt-0.5 flex items-center gap-2">
                          {isFood && <span>พลังงาน: <strong className="text-amber-400">+{item.cal} kcal</strong></span>}
                          {isSport && <span>การเผาผลาญ: <strong className="text-rose-400">🔥 ~{item.calBurn} kcal</strong></span>}
                          {isMed && <span>สถานะยา: <strong className="text-cyan-400">{item.done ? 'รับประทานแล้ว' : 'ยังไม่ได้รับประทาน'}</strong></span>}

    // ==============================================================
    // 2. COMMUNITY MODULE (Sports Venues + Top-Center Booking Modal)
    // ==============================================================
    function CommunityModule({ isDark, selectedProvinceId, setSelectedProvinceId }) {
      const [selectedVenue, setSelectedVenue] = useState(null);
      const [sportFilter, setSportFilter] = useState('all'); // 'all', 'running', 'badminton', 'sportclub', 'fitness'
      const [searchQuery, setSearchQuery] = useState('');
      
      // Booking System: 15-day window from current turn date (Saturday, Nov 7, 2026)
      const baseDate = new Date(2026, 10, 7); // Month is 0-indexed (10 = November)
      const thaiDays = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
      const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

      // Generate next 15 days
      const availableDates = Array.from({ length: 15 }, (_, i) => {
        const d = new Date(baseDate);
        d.setDate(baseDate.getDate() + i);
        const dayStr = String(d.getDate()).padStart(2, '0');
        const monthStr = String(d.getMonth() + 1).padStart(2, '0');
        const iso = `${d.getFullYear()}-${monthStr}-${dayStr}`;
        const label = i === 0 
          ? `วันนี้ (${d.getDate()} ${thaiMonths[d.getMonth()]})` 
          : i === 1 
            ? `พรุ่งนี้ (${d.getDate()} ${thaiMonths[d.getMonth()]})` 
            : `${thaiDays[d.getDay()]} ${d.getDate()} ${thaiMonths[d.getMonth()]}`;
        return { iso, label, dayNumber: d.getDate(), dayName: thaiDays[d.getDay()], isToday: i === 0 };
      });

      const [selectedDate, setSelectedDate] = useState(availableDates[0].iso);
      const [selectedTimeSlot, setSelectedTimeSlot] = useState('');
      const [selectedTrainer, setSelectedTrainer] = useState(STATIC_TRAINERS[0]);
      const [bookingType, setBookingType] = useState('community_only');

      // Helper to generate selectable time slots based on venue's actual operating hours
      const generateVenueTimeSlots = (venue) => {
        if (!venue) return [];
        const slots = [];
        const start = Math.floor(venue.openHour);
        const end = Math.floor(venue.closeHour);

        for (let h = start; h < end; h++) {
          const startFormatted = `${String(h).padStart(2, '0')}:00`;
          const endFormatted = `${String(h + 1).padStart(2, '0')}:00`;
          slots.push(`${startFormatted} - ${endFormatted} น.`);
        }
        return slots;
      };

      const handleOpenVenue = (venue) => {
        setSelectedVenue(venue);
        const slots = generateVenueTimeSlots(venue);
        setSelectedTimeSlot(slots[0] || '17:00 - 18:00 น.');
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      // Filter venues by selected province, sport filter, and keyword search
      const currentProvinceObj = PROVINCES.find(p => p.id === selectedProvinceId) || PROVINCES[0];

      const filteredVenues = VENUES_DATABASE.filter(v => {
        const matchesProvince = v.province === selectedProvinceId;
        const matchesSport = sportFilter === 'all' || v.sport === sportFilter;
        const matchesSearch = v.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              v.loc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesProvince && matchesSport && matchesSearch;
      });

      // Category counts for the active province
      const counts = {
        all: VENUES_DATABASE.filter(v => v.province === selectedProvinceId).length,
        running: VENUES_DATABASE.filter(v => v.province === selectedProvinceId && v.sport === 'running').length,
        badminton: VENUES_DATABASE.filter(v => v.province === selectedProvinceId && v.sport === 'badminton').length,
        sportclub: VENUES_DATABASE.filter(v => v.province === selectedProvinceId && v.sport === 'sportclub').length,
        fitness: VENUES_DATABASE.filter(v => v.province === selectedProvinceId && v.sport === 'fitness').length,
      };

      return (
        <div className="space-y-5">
          {/* Header & Province Selector Banner */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-xl bg-lime-400/20 text-lime-400 flex items-center justify-center font-bold">
                  {currentProvinceObj.flag}
                </span>
                <div>
                  <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
                    คลับกีฬาและสนามกีฬาประจำจังหวัด
                  </h2>
                  <p className="text-xs text-slate-400">
                    ค้นหาสนามวิ่ง คอร์ทแบด สปอร์ตคลับ และฟิตเนสชั้นนำใน <strong className="text-lime-400">{currentProvinceObj.name}</strong>
                  </p>
                </div>
              </div>
            </div>

            {/* Quick Province Switcher Pills */}
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              {PROVINCES.map(p => (
                <button
                  key={p.id}
                  onClick={() => setSelectedProvinceId(p.id)}
                  className={`px-3 py-1.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-1.5 border ${
                    selectedProvinceId === p.id
                      ? (isDark ? 'bg-lime-400 text-slate-950 border-lime-400 shadow-md font-black' : 'bg-slate-900 text-white border-slate-900 shadow-md font-black')
                      : (isDark ? 'bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50')
                  }`}
                >
                  <span>{p.flag}</span>
                  <span>{p.shortName}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Search Bar & Sport Filter Categories */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1">
            {/* Sport Category Tabs with dynamic badge counts */}
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              {[
                { id: 'all', label: 'ทั้งหมด', count: counts.all, icon: '⚡' },
                { id: 'running', label: '🏃 สวนสาธารณะ / เลนวิ่ง', count: counts.running },
                { id: 'badminton', label: '🏸 คอร์ทแบดมินตัน', count: counts.badminton },
                { id: 'sportclub', label: '🏅 สปอร์ตคลับครบวงจร', count: counts.sportclub },
                { id: 'fitness', label: '🏋️ ฟิตเนสและยิม', count: counts.fitness }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setSportFilter(tab.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-1.5 border ${
                    sportFilter === tab.id
                      ? (isDark ? 'bg-white/20 text-lime-400 border-lime-400/40 shadow-sm' : 'bg-slate-200 text-indigo-900 border-slate-300')
                      : (isDark ? 'bg-slate-900/50 border-slate-800 text-slate-400 hover:bg-slate-800' : 'bg-slate-100 border-slate-200 text-slate-600')
                  }`}
                >
                  <span>{tab.label}</span>
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                    sportFilter === tab.id ? 'bg-lime-400 text-slate-950' : 'bg-white/10 text-slate-400'
                  }`}>
                    {tab.count}
                  </span>
                </button>
              ))}
            </div>

            {/* Keyword Search */}
            <div className={`relative flex items-center px-3 py-1.5 rounded-xl border transition-all w-full sm:w-60 flex-shrink-0 ${
              isDark ? 'bg-slate-900/80 border-slate-700' : 'bg-white border-slate-300'
            }`}>
              <Icon name="search" className="w-3.5 h-3.5 text-slate-400 flex-shrink-0" />
              <input
                type="text"
                placeholder="ค้นหาชื่อสนามหรือสถานที่..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-transparent text-xs outline-none ml-2 w-full"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="text-slate-400 hover:text-white text-xs">✕</button>
              )}
            </div>
          </div>

          {/* Venues Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredVenues.map(v => {
              const sportIcons = {
                running: '🏃 สวนวิ่ง',
                badminton: '🏸 คอร์ทแบด',
                sportclub: '🏅 สปอร์ตคลับ',
                fitness: '🏋️ ฟิตเนส'
              };

              return (
                <div
                  key={v.id}
                  onClick={() => handleOpenVenue(v)}
                  className={`rounded-3xl border overflow-hidden cursor-pointer transition-all hover:scale-[1.015] hover:shadow-xl flex flex-col justify-between ${
                    isDark ? 'glass-card-dark' : 'glass-card-light'
                  }`}
                >
                  <div className="h-44 relative bg-slate-900">
                    <img src={v.image} alt={v.name} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent"></div>
                    
                    <span className="absolute top-3 left-3 px-2.5 py-0.5 rounded-full text-[10px] font-black bg-slate-900/80 backdrop-blur-md text-lime-400 border border-lime-400/30">
                      {sportIcons[v.sport]}
                    </span>

                    <span className="absolute bottom-3 right-3 px-3 py-1 rounded-xl text-xs font-black bg-slate-950/90 text-lime-400 border border-lime-400/40 shadow">
                      {v.baseCost === 0 ? 'เข้าฟรี (Public)' : `฿${v.baseCost} / ชม.`}
                    </span>
                  </div>

                  <div className="p-4 flex-1 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-1.5 text-xs text-amber-400 font-bold">
                        <span>★ {v.rating}</span>
                        <span className="text-slate-400 font-normal">• {currentProvinceObj.name}</span>
                      </div>
                      
                      <h4 className="font-bold text-sm mt-1 truncate">{v.name}</h4>
                      <p className="text-xs text-slate-400 mt-1 flex items-center gap-1">
                        <Icon name="mapPin" className="w-3.5 h-3.5 text-rose-400 flex-shrink-0" />
                        <span className="truncate">{v.loc}</span>
                      </p>

                      <div className="mt-2.5 p-2 rounded-xl bg-white/5 border border-white/5 flex items-center gap-1.5 text-xs">
                        <Icon name="clock" className="w-3.5 h-3.5 text-cyan-400 flex-shrink-0" />
                        <span className="text-slate-300 font-medium">เวลาเปิด-ปิด: <strong className="text-white">{v.openTime}</strong></span>
                      </div>

                      {/* Feature Highlights */}
                      <div className="flex flex-wrap gap-1 mt-2">

                    <div className="grid grid-cols-5 sm:grid-cols-8 gap-1.5 max-h-36 overflow-y-auto p-1.5 rounded-2xl bg-white/5 border border-white/10">

                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">

                            key={idx}

                            onClick={() => setSelectedTimeSlot(slot)}

                    <div 
                      onClick={() => setBookingType('community_only')}
                      className={`p-3 rounded-2xl border-2 cursor-pointer transition-all ${

                      }`}
                    >
                      <div className="font-bold text-xs sm:text-sm">เข้าร่วมกลุ่มคอมมูนิตี้</div>
                      <div className="text-[11px] text-slate-400">ซ้อมร่วมกับเพื่อนสมาชิกในพื้นที่</div>

                    </div>
                  </div>

                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-300">เลือกโค้ชผู้ฝึกสอนประจำจังหวัด:</label>
                      <div className="grid grid-cols-3 gap-2">
                        {STATIC_TRAINERS.map(t => (
                          <div 
                            key={t.id} 
                            onClick={() => setSelectedTrainer(t)}
                            className={`p-2 rounded-xl border text-center cursor-pointer transition-all ${
                              selectedTrainer?.id === t.id ? 'border-lime-400 bg-lime-400/20' : 'border-slate-800 bg-slate-900/40'
                            }`}
                          >
                            <img src={t.img} alt={t.name} className="w-10 h-10 rounded-full mx-auto object-cover" />
                            <div className="text-xs font-bold mt-1 truncate">{t.name}</div>

                  <div className="p-3 rounded-2xl bg-white/5 border border-white/10 text-xs text-slate-300 space-y-1">
                    <div className="font-bold text-lime-400">📋 สรุปรายการจอง:</div>
                    <div>📍 สถานที่: <strong>{selectedVenue.name}</strong> ({currentProvinceObj.name})</div>
                    <div>📅 วันที่: <strong>{availableDates.find(d => d.iso === selectedDate)?.label} ({selectedDate})</strong></div>
                    <div>⏱️ รอบเวลา: <strong>{selectedTimeSlot}</strong></div>
                    <div>👥 รูปแบบ: <strong>{bookingType === 'with_trainer' ? `มีโค้ชประกบ (${selectedTrainer?.name})` : 'ร่วมกลุ่มคอมมูนิตี้ทั่วไป'}</strong></div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className={`p-4 border-t flex items-center justify-between ${
                  isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'
                }`}>
                  <div>
                    <span className="text-[10px] text-slate-400">ยอดรวมโดยประมาณ</span>
                    <div className="text-xl font-black text-lime-400">
                      ฿{bookingType === 'with_trainer' ? (selectedVenue.baseCost + (selectedTrainer?.rate || 0)) : selectedVenue.baseCost}
                    </div>
                  </div>

                  <button 
                    onClick={() => {
                      alert(`✅ จองสำเร็จ!\nสถานที่: ${selectedVenue.name}\nจังหวัด: ${currentProvinceObj.name}\nวันที่: ${selectedDate}\nเวลา: ${selectedTimeSlot}\nระบบได้ส่งการยืนยันเข้ากระเป๋าตั๋วของคุณแล้ว`);
                      setSelectedVenue(null);
                    }}
                    className="px-6 py-2.5 bg-lime-400 text-slate-950 font-black rounded-xl text-xs hover:bg-lime-500 shadow-lg shadow-lime-400/20"
                  >
                    ยืนยันการจอง (Confirm)
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==============================================================
    // 3. COURSES MODULE (21 Courses Grouped by 3 Extremeness Tiers)
    // ==============================================================
    function CoursesModule({ isDark }) {
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [filterGroup, setFilterGroup] = useState('all'); // 'all', 'beginner', 'intermediate', 'extreme'
      const [searchQuery, setSearchQuery] = useState('');

      // ============================================================
      // AI BODY SCAN & COMPOSITION GOAL STATE
      // ============================================================
      const [showBodyScanModal, setShowBodyScanModal] = useState(false);
      const [showGoalModal, setShowGoalModal] = useState(false);
      const [bodyScanStep, setBodyScanStep] = useState('camera'); // 'camera', 'analyzing', 'result'
      const [scannedBodyImage, setScannedBodyImage] = useState(null);

      // Latest Body Composition Metrics (from scan or default baseline)
      const [bodyMetrics, setBodyMetrics] = useState({
        weight: 68.5,
        bodyFat: 22.4, // %
        muscleMass: 32.5, // kg
        bmi: 23.2,
        visceralFat: 6, // level
        bodyType: 'Skinny Fat (มวลไขมันปานกลาง-กล้ามเนื้อน้อย)',
        confidence: '97.2%',
        scannedAt: 'ล่าสุดเมื่อ 7 พ.ย. 2569'
      });

      // User Custom Goals (Fat Loss & Muscle Gain)
      const [bodyGoals, setBodyGoals] = useState({
        targetBodyFat: 15.0, // target %
        targetMuscleMass: 36.0, // target kg
        targetWeeks: 8,
        active: true
      });

      // Sample scan presets for demonstration
      const SAMPLE_BODY_PRESETS = [
        {
          weight: 71.0,
          bodyFat: 24.8,
          muscleMass: 31.8,
          bmi: 24.1,
          visceralFat: 7,
          bodyType: 'Overfat (ไขมันสะสมช่วงลำตัว)',
          confidence: '98.1%',
          image: 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=600&q=80',
          recommendedTier: 'intermediate',
          suggestedReason: 'แนะนำคอร์สระดับปานกลางเพื่อเร่งการเบิร์นไขมัน (Cardio HIIT & Functional Hypertrophy)'
        },
        {
          weight: 66.8,
          bodyFat: 18.2,
          muscleMass: 34.2,
          bmi: 22.4,
          visceralFat: 4,
          bodyType: 'Athletic Lean (สัดส่วนนักกีฬาฟิตแอนด์เฟิร์ม)',
          confidence: '96.8%',
          image: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80',
          recommendedTier: 'extreme',
          suggestedReason: 'แนะนำคอร์สระดับเอ็กซ์ตรีมเพื่อก้าวสู่ขีดสุดความแข็งแกร่ง (Hyrox & Calisthenics Beast)'
        }
      ];

      // Handle file upload/camera photo for body scan
      const handleBodyImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setScannedBodyImage(event.target.result);
            setBodyScanStep('analyzing');
            setShowBodyScanModal(true);
            window.scrollTo({ top: 0, behavior: 'instant' });

            // Simulate AI body mesh & biometric scan computation
            setTimeout(() => {
              const estimatedFat = Number((19.5 + Math.random() * 4.5).toFixed(1));
              const estimatedMuscle = Number((33.0 + Math.random() * 3.0).toFixed(1));
              setBodyMetrics({
                weight: 69.0,
                bodyFat: estimatedFat,
                muscleMass: estimatedMuscle,
                bmi: 23.4,
                visceralFat: estimatedFat > 21 ? 6 : 4,
                bodyType: estimatedFat > 21 ? 'Normal to Overfat (แนะนำปรับลดไขมัน)' : 'Lean Muscular (กล้ามเนื้อสมดุล)',
                confidence: '97.6%',
                scannedAt: 'สแกนเมื่อสักครู่'
              });
              setBodyScanStep('result');
            }, 1500);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleTriggerBodyPreset = (idx = 0) => {
        const preset = SAMPLE_BODY_PRESETS[idx];
        setScannedBodyImage(preset.image);
        setBodyScanStep('analyzing');
        setShowBodyScanModal(true);
        window.scrollTo({ top: 0, behavior: 'instant' });

        setTimeout(() => {
          setBodyMetrics({
            weight: preset.weight,
            bodyFat: preset.bodyFat,
            muscleMass: preset.muscleMass,
            bmi: preset.bmi,
            visceralFat: preset.visceralFat,
            bodyType: preset.bodyType,
            confidence: preset.confidence,
            scannedAt: 'สแกนเมื่อสักครู่'
          });
          setBodyScanStep('result');
        }, 1300);
      };

      // Gap calculations towards goal
      const fatDifference = Number((bodyMetrics.bodyFat - bodyGoals.targetBodyFat).toFixed(1));
      const muscleDifference = Number((bodyGoals.targetMuscleMass - bodyMetrics.muscleMass).toFixed(1));

      const filteredCourses = COURSES_DATA.filter(c => {
        const matchesGroup = filterGroup === 'all' || c.extremeness === filterGroup;
        const matchesQuery = c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             c.subtitle.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             c.instructor.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesGroup && matchesQuery;
      });

      const handleOpenCourse = (c) => {
        setSelectedCourse(c);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      const groupCounts = {
        all: COURSES_DATA.length,
        beginner: COURSES_DATA.filter(c => c.extremeness === 'beginner').length,
        intermediate: COURSES_DATA.filter(c => c.extremeness === 'intermediate').length,
        extreme: COURSES_DATA.filter(c => c.extremeness === 'extreme').length,
      };

      return (
        <div className="space-y-6">

          {/* ============================================================ */}
          {/* 1. TOP AI BODY SCAN & RATIO GOAL SECTION                      */}
          {/* ============================================================ */}
          <section className={`rounded-3xl p-4 sm:p-5 border transition-all shadow-xl overflow-hidden relative ${
            isDark 
              ? 'glass-card-dark bg-gradient-to-br from-[#1E1B4B]/80 via-[#13172E]/90 to-[#0F172A]/80 border-lime-400/30' 
              : 'glass-card-light bg-gradient-to-br from-indigo-50/90 via-white to-lime-50/70 border-lime-500/40'
          }`}>
            <div className="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              
              {/* Left: AI Body Scan Banner Info */}
              <div className="flex items-start sm:items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-lime-400 to-cyan-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-lg shadow-lime-400/25 flex-shrink-0 animate-pulse">
                  <Icon name="userCheck" className="w-6 h-6 stroke-[2.5]" />
                </div>
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <h3 className={`text-base sm:text-lg font-black tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>
                      AI Body Scan: ถ่ายภาพวิเคราะห์ %ไขมันและมวลกล้ามเนื้อ
                    </h3>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-lime-400 text-slate-950">
                      BODY COMPOSITION
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 mt-0.5">
                    ประเมินสรีระแม่นยำ พร้อมตั้งเป้าหมายไขมันและกล้ามเนื้อเพื่อรับคำแนะนำคอร์สเรียนที่ตรงจุด
                  </p>
                </div>
              </div>

              {/* Action Buttons: Camera Upload, Demo Scan & Goal Setting */}
              <div className="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                <input
                  type="file"
                  id="body-photo-upload"
                  accept="image/*"
                  capture="environment"
                  className="hidden"
                  onChange={handleBodyImageUpload}
                />
                
                <label
                  htmlFor="body-photo-upload"
                  className="cursor-pointer px-3.5 py-2.5 rounded-xl bg-lime-400 text-slate-950 font-black text-xs hover:bg-lime-500 transition-all flex items-center gap-1.5 shadow-md shadow-lime-400/20 active:scale-95"
                >
                  <Icon name="camera" className="w-4 h-4 stroke-[2.5]" />
                  <span>ถ่ายรูป / สแกนรูปร่าง</span>
                </label>

                <button
                  onClick={() => handleTriggerBodyPreset(0)}
                  className={`px-3 py-2.5 rounded-xl text-xs font-bold transition-all border flex items-center gap-1.5 ${
                    isDark ? 'bg-slate-800/80 hover:bg-slate-700 text-slate-200 border-slate-700' : 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300'
                  }`}
                  title="ทดสอบตัวอย่างการสแกน"
                >
                  <Icon name="sparkles" className="w-3.5 h-3.5 text-lime-400" />
                  <span>สแกนตัวอย่าง</span>
                </button>

                <button
                  onClick={() => {
                    setShowGoalModal(true);
                    window.scrollTo({ top: 0, behavior: 'instant' });
                  }}
                  className={`px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all border flex items-center gap-1.5 ${
                    isDark ? 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30 hover:bg-cyan-500/25' : 'bg-sky-100 text-sky-900 border-sky-300 hover:bg-sky-200'
                  }`}
                >
                  <Icon name="target" className="w-4 h-4 text-cyan-400 stroke-[2.5]" />
                  <span>ตั้งเป้าหมายไขมัน/กล้ามเนื้อ</span>
                </button>
              </div>
            </div>

            {/* Current Body Metrics & Target Goal Progress Dashboard */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-3 mt-4 pt-3.5 border-t border-white/10">
              
              {/* 1. Body Fat % vs Goal */}
              <div className={`p-3 rounded-2xl border ${isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className="flex items-center justify-between text-[10px] font-bold text-amber-400 uppercase tracking-wider">
                  <span>% ไขมันร่างกาย (Body Fat)</span>

                <div className="text-lg sm:text-2xl font-black mt-1 text-amber-400">
                  {bodyMetrics.bodyFat}%
                </div>
                <div className="text-[10px] text-slate-400 mt-0.5">
                  {fatDifference > 0 ? (
                    <span className="text-amber-400 font-bold">เป้าหมาย: ลดอีก -{fatDifference}%</span>
                  ) : (
                    <span className="text-emerald-400 font-bold">✓ บรรลุเป้าหมายไขมันแล้ว</span>
                  )}
                </div>
              </div>

              {/* 2. Muscle Mass vs Goal */}
              <div className={`p-3 rounded-2xl border ${isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className="flex items-center justify-between text-[10px] font-bold text-cyan-400 uppercase tracking-wider">
                  <span>มวลกล้ามเนื้อ (Muscle Mass)</span>
                  <span className="text-[9px] text-slate-400">เป้าหมาย {bodyGoals.targetMuscleMass} kg</span>
                </div>
                <div className="text-lg sm:text-2xl font-black mt-1 text-cyan-400">
                  {bodyMetrics.muscleMass} <span className="text-xs font-normal">kg</span>
                </div>
                <div className="text-[10px] text-slate-400 mt-0.5">
                  {muscleDifference > 0 ? (
                    <span className="text-cyan-400 font-bold">เป้าหมาย: เพิ่มอีก +{muscleDifference} kg</span>
                  ) : (
                    <span className="text-emerald-400 font-bold">✓ บรรลุเป้าหมายกล้ามเนื้อแล้ว</span>
                  )}
                </div>
              </div>

              {/* 3. Visceral Fat & BMI */}
              <div className={`p-3 rounded-2xl border ${isDark ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">BMI & ไขมันช่องท้อง</div>
                <div className={`text-lg sm:text-2xl font-black mt-1 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                  {bodyMetrics.bmi} <span className="text-xs font-normal text-slate-400">BMI</span>
                </div>
                <div className="text-[10px] text-slate-400 mt-0.5">
                  Visceral Fat ระดับ: <strong className="text-lime-400">{bodyMetrics.visceralFat} (ปลอดภัย)</strong>
                </div>
              </div>

              {/* 4. Course Recommendation Prompt based on Scan */}
              <div className={`p-3 rounded-2xl border flex flex-col justify-between ${
                isDark ? 'bg-lime-950/20 border-lime-400/30' : 'bg-lime-50 border-lime-300'
              }`}>
                <div>
                  <div className="text-[10px] font-black text-lime-400 uppercase tracking-wider flex items-center justify-between">
                    <span>คอร์สแนะนำสำหรับคุณ</span>
                    <span>🎯</span>
                  </div>
                  <div className={`text-xs font-bold mt-1 line-clamp-1 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                    {fatDifference > 5 ? 'ระดับปานกลาง: เบิร์นไขมัน & HIIT' : 'ระดับเอ็กซ์ตรีม: สร้างพละกำลังขั้นสูง'}
                  </div>
                  <div className="text-[10px] text-slate-400 mt-0.5">
                    เพื่อเป้าหมาย {bodyGoals.targetWeeks} สัปดาห์
                  </div>
                </div>
                <button
                  onClick={() => setFilterGroup(fatDifference > 5 ? 'intermediate' : 'extreme')}
                  className="mt-2 text-[10px] font-black text-lime-400 hover:underline flex items-center gap-1"
                >
                  <span>ดูกลุ่มคอร์สที่แนะนำ</span>
                  <Icon name="chevronRight" className="w-3 h-3 stroke-[3]" />
                </button>
              </div>

            </div>
          </section>

          {/* Header & Description */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-xl bg-lime-400/20 text-lime-400 flex items-center justify-center font-bold">
                  🎓
                </span>
                <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
                  คอร์สออกกำลังกายและพัฒนาสมรรถภาพ (Courses Hub)
                </h2>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                21 คอร์สที่ได้รับการออกแบบทางวิทยาศาสตร์การกีฬา แบ่งตาม 3 ระดับความเข้มข้น (Extremeness)
              </p>
            </div>

            {/* Search Input */}
            <div className={`relative flex items-center px-3 py-1.5 rounded-2xl border transition-all w-full md:w-64 ${
              isDark ? 'bg-slate-900/80 border-slate-700' : 'bg-white border-slate-300'
            }`}>
              <Icon name="search" className="w-4 h-4 text-slate-400 flex-shrink-0" />
              <input
                type="text"
                placeholder="ค้นหาคอร์สหรือผู้สอน..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-transparent text-xs outline-none ml-2 w-full"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="text-slate-400 hover:text-white text-xs">✕</button>
              )}
            </div>
          </div>

          {/* Extremeness Filter Tabs */}
          <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
            {[
              { id: 'all', label: 'ทั้งหมด', count: groupCounts.all, color: 'slate' },
              { id: 'beginner', label: '🌱 ระดับเริ่มต้น (ผ่อนคลาย & ฟื้นฟู)', count: groupCounts.beginner, color: 'emerald' },
              { id: 'intermediate', label: '⚡ ระดับปานกลาง (ฟิตเนส & ปั้นกล้าม)', count: groupCounts.intermediate, color: 'amber' },
              { id: 'extreme', label: '🔥 ระดับเอ็กซ์ตรีม (ขีดสุดความแข็งแกร่ง)', count: groupCounts.extreme, color: 'rose' }
            ].map(tab => {
              const isActive = filterGroup === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setFilterGroup(tab.id)}
                  className={`px-3.5 py-2 rounded-2xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-1.5 border ${
                    isActive
                      ? (isDark 
                          ? 'bg-lime-400 text-slate-950 border-lime-400 shadow-[0_0_12px_rgba(163,230,53,0.35)] font-black' 
                          : 'bg-slate-900 text-white border-slate-900 shadow-md font-black')
                      : (isDark 
                          ? 'bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800' 
                          : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50')
                  }`}
                >
                  <span>{tab.label}</span>
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                    isActive ? 'bg-slate-950/20 text-slate-950' : 'bg-white/10 text-slate-400'
                  }`}>
                    {tab.count}
                  </span>
                </button>
              );
            })}
          </div>

          {/* Course Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            {filteredCourses.map(c => {
              const badgeColors = {
                beginner: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                intermediate: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                extreme: 'bg-rose-500/20 text-rose-400 border-rose-500/30'
              };

              return (
                <div
                  key={c.id}
                  className={`rounded-3xl border overflow-hidden flex flex-col justify-between transition-all duration-300 hover:scale-[1.015] hover:shadow-2xl ${
                    isDark ? 'glass-card-dark' : 'glass-card-light'
                  }`}
                >
                  {/* Course Image & Extremeness Tag */}
                  <div className="relative h-48 w-full overflow-hidden bg-slate-900">
                    <img src={c.image} alt={c.title} className="w-full h-full object-cover transition-transform duration-500 hover:scale-105" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-black/20"></div>

                    {/* Extremeness Badge */}
                    <span className={`absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider border backdrop-blur-md ${
                      badgeColors[c.extremeness]
                    }`}>
                      {c.groupName.split(' - ')[0]}
                    </span>

                    {/* Price Tag */}
                    <span className="absolute bottom-3 right-3 px-3 py-1 rounded-xl text-xs font-black bg-slate-950/90 text-lime-400 border border-lime-400/40 shadow-lg">
                      ฿{c.price.toLocaleString()}
                    </span>
                  </div>

                  {/* Course Details Content */}
                  <div className="p-4 sm:p-5 flex-1 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-1.5 text-xs text-slate-400">
                        <span className="text-amber-400">★ {c.rating}</span>
                        <span>({c.reviewsCount} รีวิว)</span>
                        <span>•</span>
                        <span className="truncate">{c.difficulty.split('(')[0]}</span>
                      </div>

                      <h3 className={`text-base font-black mt-1 leading-snug line-clamp-1 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                        {c.title}
                      </h3>
                      <p className="text-xs text-slate-400 mt-1 line-clamp-2">
                        {c.subtitle}
                      </p>

                      {/* Instructor Info */}
                      <div className="mt-3 flex items-center gap-2 text-xs text-slate-300">
                        <span className="w-6 h-6 rounded-full bg-lime-400/20 text-lime-400 flex items-center justify-center font-bold text-[10px]">
                          👨‍🏫
                        </span>
                        <div className="min-w-0">
                          <div className="font-bold truncate text-[11px]">{c.instructor}</div>
                          <div className="text-[10px] text-slate-400 truncate">{c.instructorRole}</div>
                        </div>
                      </div>

                      {/* Metrics: Duration & Burn */}
                      <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-white/10 text-[11px]">
                        <div className={`p-2 rounded-xl border flex flex-col ${isDark ? 'bg-slate-900/50 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                          <span className="text-slate-400 text-[9px] uppercase font-bold flex items-center gap-1">
                            <Icon name="clock" className="w-3 h-3 text-cyan-400" /> ระยะเวลา
                          </span>
                          <span className="font-black mt-0.5 truncate">{c.duration.split('(')[0]}</span>
                        </div>
                        <div className={`p-2 rounded-xl border flex flex-col ${isDark ? 'bg-slate-900/50 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                          <span className="text-slate-400 text-[9px] uppercase font-bold flex items-center gap-1">
                            <Icon name="flame" className="w-3 h-3 text-rose-400" /> เผาผลาญ
                          </span>
                          <span className="font-black mt-0.5 text-rose-400 truncate">{c.burn.split('/')[0]}</span>
                        </div>
                      </div>

                      {/* Highlights Badges */}
                      <div className="flex flex-wrap gap-1 mt-2.5">
                        {c.highlights.map((h, idx) => (
                          <span key={idx} className="text-[9px] px-2 py-0.5 rounded-md bg-white/5 border border-white/10 text-slate-300">
                            ✓ {h}
                          </span>
                        ))}
                      </div>
                    </div>

                    {/* Action Button */}
                    <div className="mt-4 pt-3 border-t border-white/10 flex items-center justify-between gap-2">
                      <button
                        onClick={() => handleOpenCourse(c)}
                        className="w-full py-2.5 rounded-xl bg-lime-400 text-slate-950 font-black text-xs hover:bg-lime-500 transition-colors flex items-center justify-center gap-1.5 shadow-md shadow-lime-400/20"
                      >
                        <span>ดูรายละเอียด & สมัครคอร์ส</span>
                        <Icon name="chevronRight" className="w-4 h-4 stroke-[3]" />
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* ============================================================ */}
          {/* MODAL 1: AI BODY SCAN PROCESSOR MODAL                         */}
          {/* ============================================================ */}
          {showBodyScanModal && (
            <div 
              ref={(el) => { if (el) el.scrollTop = 0; }}
              className={`fixed inset-0 z-50 flex items-start justify-center pt-4 sm:pt-8 md:pt-10 px-3 sm:px-4 pb-12 overflow-y-auto backdrop-blur-md animate-fadeIn ${
                isDark ? 'bg-black/85 text-white' : 'bg-slate-900/60 text-slate-900'
              }`}
            >
              <div className={`w-full max-w-lg rounded-3xl border shadow-2xl overflow-hidden flex flex-col relative my-auto sm:my-0 transition-all ${
                isDark ? 'bg-[#0F1424] border-white/20' : 'bg-white border-slate-200'
              }`}>
                {/* Header */}
                <div className={`px-5 py-3.5 border-b flex items-center justify-between ${
                  isDark ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-50 border-slate-200'
                }`}>
                  <div className="flex items-center gap-2">
                    <Icon name="userCheck" className="w-4 h-4 text-lime-400" />
                    <span className="text-sm font-black">ผลวิเคราะห์สรีระและสัดส่วน (AI Body Composition)</span>
                  </div>
                  <button onClick={() => setShowBodyScanModal(false)} className="p-1.5 text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Content */}
                <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
                  <div className="relative rounded-2xl overflow-hidden h-56 bg-slate-950">
                    {scannedBodyImage && (
                      <img src={scannedBodyImage} alt="Body Scan" className="w-full h-full object-cover" />
                    )}

                    {/* Scanning Animation Overlayer */}
                    {bodyScanStep === 'analyzing' && (
                      <div className="absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex flex-col items-center justify-center">
                        <div className="w-16 h-16 rounded-full border-4 border-cyan-400 border-t-transparent animate-spin mb-3"></div>
                        <div className="text-xs font-black text-cyan-400 animate-pulse">กำลังคำนวณ Body Fat Ratio & Muscle Density...</div>
                        <div className="text-[10px] text-slate-300 mt-1">Biometric Visual Mapping Active</div>
                      </div>
                    )}

                    {bodyScanStep === 'result' && (
                      <div className="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-black bg-lime-400 text-slate-950 shadow-md">
                        ความแม่นยำ AI {bodyMetrics.confidence}
                      </div>
                    )}
                  </div>

                  {bodyScanStep === 'result' && (
                    <div className="space-y-4 animate-fadeIn">
                      <div>
                        <div className="text-xs font-bold text-lime-400 uppercase tracking-wider">รูปร่างปัจจุบันของคุณ:</div>
                        <h3 className="text-base sm:text-lg font-black mt-0.5">{bodyMetrics.bodyType}</h3>
                      </div>

                      {/* Metrics 4 Grid */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                        <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30">
                          <div className="text-[10px] text-slate-400">เปอร์เซ็นต์ไขมัน</div>
                          <div className="text-lg font-black text-amber-400 mt-0.5">{bodyMetrics.bodyFat}%</div>
                        </div>
                        <div className="p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30">
                          <div className="text-[10px] text-slate-400">มวลกล้ามเนื้อ</div>
                          <div className="text-lg font-black text-cyan-400 mt-0.5">{bodyMetrics.muscleMass} kg</div>
                        </div>
                        <div className="p-2.5 rounded-xl bg-indigo-500/10 border border-indigo-500/30">
                          <div className="text-[10px] text-slate-400">BMI</div>
                          <div className="text-lg font-black text-indigo-400 mt-0.5">{bodyMetrics.bmi}</div>
                        </div>
                        <div className="p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30">
                          <div className="text-[10px] text-slate-400">ไขมันช่องท้อง</div>
                          <div className="text-lg font-black text-rose-400 mt-0.5">Level {bodyMetrics.visceralFat}</div>
                        </div>
                      </div>

                      {/* Course recommendation prompt */}
                      <div className="p-3.5 rounded-2xl bg-white/5 border border-white/10 text-xs text-slate-300 space-y-1.5">
                        <div className="font-bold text-lime-400 flex items-center gap-1.5">
                          <span>💡 คำแนะนำเพื่อพิชิตเป้าหมาย ({bodyGoals.targetBodyFat}% ไขมัน / {bodyGoals.targetMuscleMass}kg กล้ามเนื้อ):</span>
                        </div>
                        <p>
                          สรีระของคุณตอบสนองได้ดีที่สุดกับการออกกำลังกายผสมผสานเวทเทรนนิ่งเพื่อรักษาความหนาแน่นกล้ามเนื้อ และคาร์ดิโอช่วงความเข้มข้นสูงเพื่อเบิร์นไขมันส่วนเกิน
                        </p>
                      </div>

                      <div className="flex gap-2">
                        <button
                          onClick={() => {
                            setShowBodyScanModal(false);
                            setFilterGroup('intermediate');
                          }}
                          className="flex-1 py-3 bg-lime-400 text-slate-950 font-black rounded-xl text-xs hover:bg-lime-500 transition-colors"
                        >
                          ไปที่คอร์สแนะนำสำหรับสรีระนี้
                        </button>
                        <button
                          onClick={() => {
                            setShowBodyScanModal(false);
                            setShowGoalModal(true);
                          }}
                          className="px-4 py-3 bg-white/10 text-white font-bold rounded-xl text-xs hover:bg-white/20 transition-colors"
                        >
                          ปรับแต่งเป้าหมาย
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ============================================================ */}
          {/* MODAL 2: CUSTOMIZE FAT & MUSCLE RATIO GOAL MODAL             */}
          {/* ============================================================ */}
          {showGoalModal && (
            <div 
              ref={(el) => { if (el) el.scrollTop = 0; }}
              className={`fixed inset-0 z-50 flex items-start justify-center pt-4 sm:pt-8 md:pt-10 px-3 sm:px-4 pb-12 overflow-y-auto backdrop-blur-md animate-fadeIn ${
                isDark ? 'bg-black/85 text-white' : 'bg-slate-900/60 text-slate-900'
              }`}
            >
              <div className={`w-full max-w-md rounded-3xl border shadow-2xl p-5 sm:p-6 space-y-4 relative my-auto sm:my-0 transition-all ${
                isDark ? 'bg-slate-900 border-white/20 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex justify-between items-center pb-2 border-b border-white/10">
                  <div className="flex items-center gap-2">
                    <Icon name="target" className="w-5 h-5 text-lime-400" />
                    <h3 className="text-base font-black">ตั้งเป้าหมายสัดส่วนร่างกาย (Ratio Goals)</h3>
                  </div>
                  <button onClick={() => setShowGoalModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-slate-400">
                  ระบุเป้าหมาย % ไขมันและมวลกล้ามเนื้อที่คุณต้องการพิชิต ระบบจะคำนวณตารางคอร์สออนไลน์ที่เหมาะสมที่สุด
                </p>

                <div className="space-y-3.5">
                  {/* Target Body Fat % */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-amber-400">เป้าหมาย % ไขมันในร่างกาย (Target Body Fat):</span>
                      <span className="font-mono text-lime-400">{bodyGoals.targetBodyFat}%</span>
                    </div>
                    <input
                      type="range"
                      min="10"
                      max="30"
                      step="0.5"
                      value={bodyGoals.targetBodyFat}
                      onChange={(e) => setBodyGoals(prev => ({ ...prev, targetBodyFat: parseFloat(e.target.value) }))}
                      className="w-full accent-lime-400 cursor-pointer"
                    />
                    <div className="flex justify-between text-[10px] text-slate-400">
                      <span>10% (ลีนจัด)</span>
                      <span>ปัจจุบัน {bodyMetrics.bodyFat}%</span>
                      <span>30%</span>
                    </div>
                  </div>

                  {/* Target Muscle Mass kg */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="text-cyan-400">เป้าหมายมวลกล้ามเนื้อ (Target Muscle Mass):</span>
                      <span className="font-mono text-cyan-400">{bodyGoals.targetMuscleMass} kg</span>
                    </div>
                    <input
                      type="range"
                      min="28"
                      max="45"
                      step="0.5"
                      value={bodyGoals.targetMuscleMass}
                      onChange={(e) => setBodyGoals(prev => ({ ...prev, targetMuscleMass: parseFloat(e.target.value) }))}
                      className="w-full accent-cyan-400 cursor-pointer"
                    />
                    <div className="flex justify-between text-[10px] text-slate-400">
                      <span>28 kg</span>
                      <span>ปัจจุบัน {bodyMetrics.muscleMass} kg</span>
                      <span>45 kg</span>
                    </div>
                  </div>

                  {/* Target Duration in Weeks */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs font-bold">
                      <span>กรอบเวลาเป้าหมาย (Target Timeline):</span>
                      <span className="text-slate-300">{bodyGoals.targetWeeks} สัปดาห์</span>
                    </div>
                    <select
                      value={bodyGoals.targetWeeks}
                      onChange={(e) => setBodyGoals(prev => ({ ...prev, targetWeeks: parseInt(e.target.value, 10) }))}
                      className="w-full px-3 py-2 rounded-xl border bg-slate-800 border-slate-700 text-white text-xs outline-none cursor-pointer"
                    >
                      <option value="4">4 สัปดาห์ (เร่งด่วน)</option>
                      <option value="6">6 สัปดาห์ (แนะนำ)</option>
                      <option value="8">8 สัปดาห์ (ยั่งยืน)</option>
                      <option value="12">12 สัปดาห์ (ปรับโครงสร้างร่างกายสมบูรณ์)</option>
                    </select>
                  </div>

                  {/* Target Goal Summary Badge */}
                  <div className="p-3 rounded-2xl bg-white/5 border border-white/10 text-xs text-slate-300">
                    <div>🔥 ส่วนต่างที่ต้องพิชิต:</div>
                    <div className="font-bold text-lime-400 mt-1">
                      • ปรับลดไขมัน: {Math.max(0, Number((bodyMetrics.bodyFat - bodyGoals.targetBodyFat).toFixed(1)))}%
                    </div>
                    <div className="font-bold text-cyan-400 mt-0.5">
                      • เพิ่มกล้ามเนื้อ: +{Math.max(0, Number((bodyGoals.targetMuscleMass - bodyMetrics.muscleMass).toFixed(1)))} กก.
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      alert('บันทึกเป้าหมายสัดส่วนร่างกายเรียบร้อย! คัดเลือกคอร์สที่ตรงตามเป้าหมายให้คุณแล้ว');

                <div className={`px-4 sm:px-6 py-3.5 border-b flex items-center justify-between ${

                      </div>
                      <div className="text-xl font-black text-lime-400">

                  <p className="text-xs text-slate-300 leading-relaxed bg-white/5 p-3.5 rounded-2xl border border-white/10">
                    {selectedCourse.description}
